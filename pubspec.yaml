name: minicrm
description: "MiniCRM - a Flutter CRM app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  equatable: ^2.0.8
  uuid: ^4.5.3
  flutter_foreground_task: ^9.2.2
  dio: ^5.7.0
  path_provider: ^2.1.5
  objectbox: ^5.3.1
  objectbox_flutter_libs: ^5.3.1
  shared_preferences: ^2.5.3
  tflite_flutter: ^0.12.1
  dart_sentencepiece_tokenizer: ^1.3.2
  markdown: ^7.3.1
  flutter_widget_from_html_core: ^0.17.2
  file_picker: ^11.0.2
  syncfusion_flutter_pdf: ^33.2.5
  flutter_gemma: ^0.15.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
  build_runner: ^2.4.13
  objectbox_generator: ^5.3.1

flutter:
  uses-material-design: true
